<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-1deg); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes glowOrb {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes particleFloat {
        0% { transform: translate(0, 0); opacity: 0.2; }
        50% { opacity: 0.7; }
        100% { transform: translate(-30px, -20px); opacity: 0.2; }
      }
      .anim-float1 { animation: floatSlow 6s ease-in-out infinite; }
      .anim-float2 { animation: floatReverse 7s ease-in-out infinite; }
      .anim-beam { stroke-dasharray: 80 120; animation: pulseBeam 4s linear infinite; }
      .anim-orb { animation: glowOrb 5s ease-in-out infinite; transform-origin: center; }
      .anim-particle { animation: particleFloat 4s ease-in-out infinite alternate; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs in Background -->
  <circle class="anim-orb" cx="150" cy="70" r="120" fill="#38bdf8" filter="blur(60px)" />
  <circle class="anim-orb" cx="1050" cy="270" r="140" fill="#818cf8" filter="blur(70px)" />
  <circle class="anim-orb" cx="950" cy="80" r="100" fill="#c084fc" filter="blur(60px)" />

  <!-- Dynamic Technical Circuits & Flows (Background Layer) -->
  <g opacity="0.6">
    <path class="anim-beam" d="M 50 280 L 250 280 L 320 220 L 500 220" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="anim-beam" d="M 700 80 L 880 80 L 940 140 L 1150 140" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <path class="anim-beam" d="M 850 290 L 980 290 L 1040 230 L 1160 230" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Floating Dynamic Tech Pills / Badges (Background & Flanks) -->
  <g class="anim-float1">
    <!-- Left Pill: Automated Routing -->
    <rect x="70" y="55" width="210" height="38" rx="19" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="89" cy="74" r="5" fill="#38bdf8" />
    <text x="105" y="79" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">⚡ ZERO INVENTORY</text>
  </g>

  <g class="anim-float2">
    <!-- Right Pill: Global Fulfillment -->
    <rect x="920" y="45" width="220" height="38" rx="19" fill="url(#pillGrad2)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="939" cy="64" r="5" fill="#c084fc" />
    <text x="955" y="69" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🌍 DISTRIBUTED POD</text>
  </g>

  <g class="anim-float1">
    <!-- Lower Right Pill: Direct API Sync -->
    <rect x="880" y="240" width="240" height="38" rx="19" fill="url(#pillGrad3)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="899" cy="259" r="5" fill="#34d399" />
    <text x="915" y="264" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">📦 ON-DEMAND EXECUTION</text>
  </g>

  <g class="anim-float2">
    <!-- Lower Left Pill: 3D Product Customization -->
    <rect x="60" y="225" width="220" height="38" rx="19" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="79" cy="244" r="5" fill="#818cf8" />
    <text x="95" y="249" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🎨 3D CUSTOMIZERS</text>
  </g>

  <!-- Foreground Centered Branding & Typography (Ensured Unobscured & High Contrast) -->
  <g id="foreground-content">
    <!-- Category Super-Title / Eyebrow -->
    <g transform="translate(600, 75)">
      <rect x="-140" y="-16" width="280" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text text-anchor="middle" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome On-Demand Manufacturing
    </text>

    <!-- Gradient Highlight Underline / Line Accent -->
    <rect x="420" y="165" width="360" height="3" rx="1.5" fill="url(#primaryGlow)" />

    <!-- Subtitle -->
    <text x="600" y="202" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Print-On-Demand Platforms • Custom Product Manufacturing • Headless Commerce &amp; 3D Editors
    </text>

    <!-- Feature Tagline Highlights -->
    <g transform="translate(600, 248)">
      <text text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        <tspan fill="#38bdf8">✦</tspan> Enterprise SaaS Metrics   
        <tspan fill="#64748b"> | </tspan> 
        <tspan fill="#818cf8">✦</tspan> Star-Ranked Open Source   
        <tspan fill="#64748b"> | </tspan> 
        <tspan fill="#c084fc">✦</tspan> Automated API Pipelines
      </text>
    </g>
  </g>

  <!-- Modern Border Stroke -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
